repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4 # manter alinhado à versão do ruff no poetry.lock
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: system
        types: [python]
        pass_filenames: false

      # src/f1/dashboard.py tem o mesmo nome de módulo do pacote f1/dashboard/,
      # por isso `mypy src` não o enxerga; é checado à parte.
      - id: mypy-dashboard
        name: mypy (dashboard)
        entry: poetry run mypy src/f1/dashboard.py
        language: system
        types: [python]
        pass_filenames: false
